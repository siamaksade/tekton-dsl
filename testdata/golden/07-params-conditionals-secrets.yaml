apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
    name: full-params
    labels:
        app.kubernetes.io/managed-by: tkn-dsl
spec:
    pipelineSpec:
        params:
            - name: branch
              type: string
              default: main
            - name: config
              type: object
              description: Build config
              default:
                optimize: true
            - name: repo-url
              type: string
              default: https://github.com/example/repo
            - name: targets
              type: array
              default:
                - staging
                - production
        workspaces:
            - name: shared-workspace
            - name: secret-git-credentials
        tasks:
            - name: build
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: build
                      image: redhat/ubi9-minimal
                      script: |-
                        #!/bin/sh
                        echo building $(params.branch)
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
            - name: deploy
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: deploy
                      image: redhat/ubi9-minimal
                      script: |-
                        #!/bin/sh
                        echo deploying
              runAfter:
                - build
              when:
                - input: $(params.branch)
                  operator: in
                  values:
                    - main
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
            - name: skip-dev
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: skip-dev
                      image: redhat/ubi9-minimal
                      script: |-
                        #!/bin/sh
                        echo not dev
              runAfter:
                - build
              when:
                - input: $(params.branch)
                  operator: notin
                  values:
                    - dev
                    - test
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
        finally:
            - name: cleanup
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: cleanup
                      image: redhat/ubi9-minimal
                      script: |-
                        #!/bin/sh
                        echo cleanup
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
    workspaces:
        - name: shared-workspace
          volumeClaimTemplate:
            spec:
                accessModes:
                    - ReadWriteOnce
                resources:
                    requests:
                        storage: 1Gi
        - name: secret-git-credentials
          secret:
            secretName: git-creds
