apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
    name: cached-build
    labels:
        app.kubernetes.io/managed-by: tkn-dsl
spec:
    pipelineSpec:
        workspaces:
            - name: shared-workspace
        tasks:
            - name: build
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: cache-fetch-mod
                      image: registry.redhat.io/openshift-pipelines/pipelines-cache-rhel9@sha256:ce548401247c025aa5dee6ed641ede514a8ce19cbfb6fbe41edeabcdb1d493f2
                      script: |
                        #!/bin/sh
                        PATTERN_FLAGS=""
                        echo "Patterns: $@"
                        for p in "$@"; do
                          PATTERN_FLAGS="${PATTERN_FLAGS} --pattern ${p}"
                        done

                        set -x
                        /ko-app/cache fetch ${PATTERN_FLAGS} \
                                            --source ${PARAM_SOURCE} \
                                            --folder ${PARAM_CACHE_PATH} \
                                            --insecure ${PARAM_INSECURE} \
                                            --workingdir ${PARAM_WORKING_DIR}
                        if [ $? -eq 0 ]; then
                          echo -n true > $(step.results.fetched.path)
                        else
                          echo -n false > $(step.results.fetched.path)
                        fi
                      env:
                        - name: PARAM_SOURCE
                          value: oci://registry.example.com/my-cache:mod-{{hash}}
                        - name: PARAM_CACHE_PATH
                          value: /go/pkg/mod
                        - name: PARAM_WORKING_DIR
                          value: $(workspaces.shared-workspace.path)
                        - name: PARAM_INSECURE
                          value: "false"
                      args:
                        - '**/go.sum'
                      results:
                        - name: fetched
                          type: string
                    - name: cache-fetch-go-build
                      image: registry.redhat.io/openshift-pipelines/pipelines-cache-rhel9@sha256:ce548401247c025aa5dee6ed641ede514a8ce19cbfb6fbe41edeabcdb1d493f2
                      script: |
                        #!/bin/sh
                        PATTERN_FLAGS=""
                        echo "Patterns: $@"
                        for p in "$@"; do
                          PATTERN_FLAGS="${PATTERN_FLAGS} --pattern ${p}"
                        done

                        set -x
                        /ko-app/cache fetch ${PATTERN_FLAGS} \
                                            --source ${PARAM_SOURCE} \
                                            --folder ${PARAM_CACHE_PATH} \
                                            --insecure ${PARAM_INSECURE} \
                                            --workingdir ${PARAM_WORKING_DIR}
                        if [ $? -eq 0 ]; then
                          echo -n true > $(step.results.fetched.path)
                        else
                          echo -n false > $(step.results.fetched.path)
                        fi
                      env:
                        - name: PARAM_SOURCE
                          value: oci://registry.example.com/my-cache:go-build-{{hash}}
                        - name: PARAM_CACHE_PATH
                          value: /root/.cache/go-build
                        - name: PARAM_WORKING_DIR
                          value: $(workspaces.shared-workspace.path)
                        - name: PARAM_INSECURE
                          value: "false"
                      args:
                        - '**/go.sum'
                        - '**/go.mod'
                      results:
                        - name: fetched
                          type: string
                    - name: build
                      image: golang:1.22
                      script: |
                        #!/bin/sh
                        cd $(workspaces.shared-workspace.path)/repo
                        go build -o app .
                    - name: cache-upload-mod
                      image: registry.redhat.io/openshift-pipelines/pipelines-cache-rhel9@sha256:ce548401247c025aa5dee6ed641ede514a8ce19cbfb6fbe41edeabcdb1d493f2
                      script: |
                        #!/bin/sh
                        if [ "${PARAM_FORCE_CACHE_UPLOAD}" = "false" ] && [ "${RESULT_CACHE_FETCHED}" = "true" ]; then
                          echo "no need to upload cache"
                          exit 0
                        fi

                        PATTERN_FLAGS=""
                        echo "Patterns: $@"
                        for p in "$@"; do
                          PATTERN_FLAGS="${PATTERN_FLAGS} --pattern ${p}"
                        done

                        set -ex
                        /ko-app/cache upload ${PATTERN_FLAGS} \
                                            --target ${PARAM_TARGET} \
                                            --folder ${PARAM_CACHE_PATH} \
                                            --insecure ${PARAM_INSECURE} \
                                            --workingdir ${PARAM_WORKING_DIR}
                      env:
                        - name: PARAM_TARGET
                          value: oci://registry.example.com/my-cache:mod-{{hash}}
                        - name: PARAM_CACHE_PATH
                          value: /go/pkg/mod
                        - name: PARAM_WORKING_DIR
                          value: $(workspaces.shared-workspace.path)
                        - name: PARAM_INSECURE
                          value: "false"
                        - name: RESULT_CACHE_FETCHED
                          value: $(steps.cache-fetch-mod.results.fetched)
                        - name: PARAM_FORCE_CACHE_UPLOAD
                          value: "false"
                      args:
                        - '**/go.sum'
                    - name: cache-upload-go-build
                      image: registry.redhat.io/openshift-pipelines/pipelines-cache-rhel9@sha256:ce548401247c025aa5dee6ed641ede514a8ce19cbfb6fbe41edeabcdb1d493f2
                      script: |
                        #!/bin/sh
                        if [ "${PARAM_FORCE_CACHE_UPLOAD}" = "false" ] && [ "${RESULT_CACHE_FETCHED}" = "true" ]; then
                          echo "no need to upload cache"
                          exit 0
                        fi

                        PATTERN_FLAGS=""
                        echo "Patterns: $@"
                        for p in "$@"; do
                          PATTERN_FLAGS="${PATTERN_FLAGS} --pattern ${p}"
                        done

                        set -ex
                        /ko-app/cache upload ${PATTERN_FLAGS} \
                                            --target ${PARAM_TARGET} \
                                            --folder ${PARAM_CACHE_PATH} \
                                            --insecure ${PARAM_INSECURE} \
                                            --workingdir ${PARAM_WORKING_DIR}
                      env:
                        - name: PARAM_TARGET
                          value: oci://registry.example.com/my-cache:go-build-{{hash}}
                        - name: PARAM_CACHE_PATH
                          value: /root/.cache/go-build
                        - name: PARAM_WORKING_DIR
                          value: $(workspaces.shared-workspace.path)
                        - name: PARAM_INSECURE
                          value: "false"
                        - name: RESULT_CACHE_FETCHED
                          value: $(steps.cache-fetch-go-build.results.fetched)
                        - name: PARAM_FORCE_CACHE_UPLOAD
                          value: "false"
                      args:
                        - '**/go.sum'
                        - '**/go.mod'
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
    workspaces:
        - name: shared-workspace
          volumeClaimTemplate:
            spec:
                accessModes:
                    - ReadWriteOnce
                resources:
                    requests:
                        storage: 1Gi
