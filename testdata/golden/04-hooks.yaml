apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
    name: hooks-test
    labels:
        app.kubernetes.io/managed-by: tkn-dsl
spec:
    pipelineSpec:
        workspaces:
            - name: shared-workspace
        tasks:
            - name: build
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: before-run
                      image: golang:1.22
                      script: |-
                        #!/bin/sh
                        echo "Starting task"
                    - name: build
                      image: golang:1.22
                      script: |-
                        #!/bin/sh
                        go build -o app .
                    - name: after-run
                      image: golang:1.22
                      script: |-
                        #!/bin/sh
                        echo "Task done"
                      onError: continue
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
            - name: test
              taskSpec:
                workspaces:
                    - name: shared-workspace
                steps:
                    - name: before-run
                      image: golang:1.22
                      script: |
                        #!/bin/sh
                        echo "Custom before for test"
                        go mod download
                    - name: test
                      image: golang:1.22
                      script: |-
                        #!/bin/sh
                        go test ./...
                    - name: after-run
                      image: golang:1.22
                      script: |-
                        #!/bin/sh
                        echo "Task done"
                      onError: continue
              runAfter:
                - build
              workspaces:
                - name: shared-workspace
                  workspace: shared-workspace
    workspaces:
        - name: shared-workspace
          volumeClaimTemplate:
            spec:
                accessModes:
                    - ReadWriteOnce
                resources:
                    requests:
                        storage: 1Gi
