# Params (all types), conditionals, finally, secrets
name: full-params

params:
  repo-url: "https://github.com/example/repo"
  branch: "main"
  targets: ["staging", "production"]
  config:
    description: "Build config"
    default:
      optimize: true

secrets:
  git-credentials: git-creds

tasks:
  build:
    image: redhat/ubi9-minimal
    run: echo building $(params.branch)

  deploy:
    needs: [build]
    if: params.branch == 'main'
    image: redhat/ubi9-minimal
    run: echo deploying

  skip-dev:
    needs: [build]
    if: params.branch not in ("dev", "test")
    image: redhat/ubi9-minimal
    run: echo not dev

finally:
  cleanup:
    image: redhat/ubi9-minimal
    run: echo cleanup
