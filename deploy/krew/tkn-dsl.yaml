apiVersion: krew.googlecontainertools.github.com/v1alpha2
kind: Plugin
metadata:
  name: dsl
spec:
  version: "v0.1.0"
  homepage: https://github.com/ssadeghi/tkn-dsl
  shortDescription: Compile simplified YAML DSL to Tekton PipelineRun CRs
  description: |
    tkn-dsl compiles a simplified YAML DSL into Tekton PipelineRun
    Custom Resources compatible with Pipelines-as-Code. It reduces
    ~80 lines of Tekton YAML to ~20 lines of DSL.
  platforms:
    - selector:
        matchLabels:
          os: darwin
          arch: amd64
      uri: https://github.com/ssadeghi/tkn-dsl/releases/download/v0.1.0/tkn-dsl_0.1.0_darwin_amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: tkn-dsl
    - selector:
        matchLabels:
          os: darwin
          arch: arm64
      uri: https://github.com/ssadeghi/tkn-dsl/releases/download/v0.1.0/tkn-dsl_0.1.0_darwin_arm64.tar.gz
      sha256: "PLACEHOLDER"
      bin: tkn-dsl
    - selector:
        matchLabels:
          os: linux
          arch: amd64
      uri: https://github.com/ssadeghi/tkn-dsl/releases/download/v0.1.0/tkn-dsl_0.1.0_linux_amd64.tar.gz
      sha256: "PLACEHOLDER"
      bin: tkn-dsl
    - selector:
        matchLabels:
          os: linux
          arch: arm64
      uri: https://github.com/ssadeghi/tkn-dsl/releases/download/v0.1.0/tkn-dsl_0.1.0_linux_arm64.tar.gz
      sha256: "PLACEHOLDER"
      bin: tkn-dsl
    - selector:
        matchLabels:
          os: windows
          arch: amd64
      uri: https://github.com/ssadeghi/tkn-dsl/releases/download/v0.1.0/tkn-dsl_0.1.0_windows_amd64.zip
      sha256: "PLACEHOLDER"
      bin: tkn-dsl.exe
